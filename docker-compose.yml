services:
  flux-q4:
    build:
      context: .
    image: flux-q4-service:latest
    container_name: flux-q4-service
    network_mode: host
    volumes:
      - .:/app
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
